<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Creating a site that you can add movies to and then search the movie list to find them.">
    <meta name="author" content="Matthew Berg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie List Site</title>
    <link href="movie-site.css" rel="stylesheet">
    <script src="movie-site.js" defer></script>
</head>
<body>
    <header>
        <img src="images/film-reel-flowing-strip.png" alt="Film Reel Icon">
        <h1>List my Movies</h1>
    </header>
    <main>
        <form class="search-bar">
            <input id="search" type="text" placeholder="Find a movie" aria-label="Search for one of your movie titles">
             <button>
            <img src="images/search-icon-1.png" alt="Search icon"></button>   
        </form>
            <div class="movie-card" id="recipe-card">

            </div>

        <h2>New Movie Entry</h2>

        <form id="movieForm">
            <div class="field">
                <label for="movieName">Movie Title</label>
                <input id="movieName" name="movieName" type="text" required />
            </div>
            <div class="field">
                <label for="ratingMovie">Movie Rating</label>
                <input id="ratingMovie" name="ratingMovie" type="text" required />
            </div>
            <div class="field">
                <label for="movieDescription">Description of the Movie</label>
                <input id="movieDescription" name="movieDescription" type="text" required />
            </div>
            <div class="field">
                <label for="dateMovieEntered">Select the Movie Entry Date</label>
                <input id="dateMovieEntered" name="dateMovieEntered" type="date" />
            </div>
        </form>


        
    </main>
    <footer>
        <a href="#"><img src="images/instagram_icon.png" alt="instagram icon"></a>
        <a href="#"><img src="images/youtube_icon.png" alt="youtube icon"></a>
        <a href="#"><img src="images/pinterest_icon.png" alt="pinterest icon"></a>
        </div> 
    </footer>
</body>
</html>
