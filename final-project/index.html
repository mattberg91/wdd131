<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description"
        content="A web app designed to add movies to a list and then search the movie list to find them.">
    <meta name="author" content="Matthew Berg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie List Site</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <link href="movie-site.css" rel="stylesheet">
    <script src="movie-site.js" defer></script>
    <link rel="icon" href="/favicon.ico">
</head>

<body>
    <header>
        <img src="images/film-reel-flowing-strip.webp" alt="Film Reel Icon" width="100" height="100">
        <h1>List my Movies</h1>
    </header>
    <main>
        <form id="searchForm" class="search-bar">
            <input id="search" type="text" placeholder="Find a movie" aria-label="Search for one of your movie titles">
            <button type="submit" class="search-button">
                <img src="images/search-icon-1.webp" alt="Search icon" width="24" height="24"></button>
        </form>
        <div class="movie-list" id="movieCard">

        </div>
        <section class="movie-entry">
            <h2>New Movie Entry</h2>

            <form id="movieForm">
                <div class="field">
                    <label for="movieName">Movie Title</label>
                    <input id="movieName" name="movieName" type="text" required />
                </div>
                <div class="field">
                    <label for="ratingMovie">Movie Rating</label>
                    <input id="ratingMovie" name="ratingMovie" type="text" required />
                </div>
                <div class="field description-field">
                    <label for="movieDescription">Description of the Movie</label>
                    <textarea id="movieDescription" name="movieDescription" rows="5" required></textarea>
                </div>
                <div class="field">
                    <label for="dateMovieEntered">Select the Movie Entry Date</label>
                    <input id="dateMovieEntered" name="dateMovieEntered" type="date" />
                </div>
                <button class="full" type="submit">Add Movie</button>
            </form>
            <div id="output"></div>
        </section>

    </main>
    <footer>
        <div class="social">
            <a href="#"><img src="images/instagram_icon.webp" alt="instagram icon" width="30" height="30"></a>
            <a href="#"><img src="images/youtube_icon.webp" alt="youtube icon" width="30" height="30"></a>
            <a href="#"><img src="images/pinterest_icon.webp" alt="pinterest icon" width="30" height="30"></a>
        </div>
    </footer>
</body>

</html>
