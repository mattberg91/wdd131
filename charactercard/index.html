<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snortblat Character Card</title>

    <meta property="og:title" content="Snortblat Character Card">
    <meta property="og:description" content="A character card for the Swamp Beast Diplomat known as Snortblat.">
    <meta property="og:image" content="snortleblat.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mattberg91.github.io/wdd131/charactercard/">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Snortblat Character Card">
    <meta name="twitter:description" content="A character card for the Swamp Beast Diplomat known as Snortblat.">
    <meta name="twitter:image" content="snortleblat.png">        

    <link rel="stylesheet" href="charactercard.css">
    <script src="charactercard.js" defer></script>
</head>
<body>
    <div class="card">
        <img class="characterimg" src="snortleblat.png" alt="snortleblat">
        <h1 id="characterName"class="characterName"></h1>
            <div class="stats">
                <p><strong>Class:</strong> <span id="characterClass"></span></p>
                <p><strong>Level:</strong> <span id="characterLevel"></span></p>
                <p><strong>Health:</strong> <span id="characterHealth"></span></p>

            </div>

        <div class="buttons">
            <button id="attackBtn">Attack Character</button>
            <button id="levelUpBtn">Level Up</button>
        </div>
        <p id="message"></p>

    </div>

</body>
</html>
