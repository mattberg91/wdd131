<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket Form</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="event.css"/>
    <script src="form.js" defer></script>
</head>
<body>
    <main class="wrapper">
    <h1>Event Ticket</h1>

    <form id="fsyForm">
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" required />
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" required />
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>

      <div class="field">
        <label for="tickettype">Type</label>
        <select
          id="tickettype"
          name="tickettype"
          aria-controls="notesContainer"
          required
        >
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div id="studentBox" style="display: none;">
        <label for="studentId">Student ID Number:</label>
        <input type="text" id="studentId" name="studentId" />
      </div>

      <div id="guestBox" style="display: none;">
        <label for="accessCode">Guest Access Code:</label>
        <input type="text" id="accessCode" name="accessCode" />
      </div>

      <div class="field">
        <label for="availableDate">Event Date</label>
        <input id="availableDate" name="availableDate" type="date" required />
      </div>




      <button class="full" type="submit">Submit Preferences</button>
    </form>

    <section id="output" aria-live="polite"></section>
  </main>
</body>
</html>
