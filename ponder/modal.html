<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Creating a responsive gallery using HTML and CSS.">
    <meta name="author" content="Matthew Berg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Gallery/modal</title>
    <link rel="stylesheet" href="modal.css">
    <script src="modal.js" defer></script>
    
</head>
<body>
    
    
    <h1>Gallery</h1>
        <section class="gallery">
            <figure>  
                <img src="images2/book-sm.jpg" alt="person reading a book">
            </figure>
            <figure>  
                <img src="images2/couch-sm.jpg" alt="person sitting on a couch with a phone">
            </figure>
            <figure>  
                <img src="images2/desk-sm.jpg" alt="a work desktop">
            </figure>
            <figure>  
                <img src="images2/keyboard-sm.jpg" alt="person typing on a keyboard">
            </figure>
            <figure>  
                <img src="images2/phone-sm.jpg" alt="person looking at a phone">
            </figure>
            <figure>  
                <img src="images2/sit-sm.jpg" alt="person sitting on a couch">
            </figure>
        </section>
        <dialog>
            <img>
            <button class="close-viewer">X</button>
        </dialog>
            





</body>
</html>
