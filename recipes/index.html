<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book Site
    ">
    <meta property="og:description" content="A Recipe Book Sight for delicious recipes.">
    <meta property="og:url" content="https://mattberg91.github.io/wdd131/recipes/">
    <meta property="og:image" size="1200x630"content="images/social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Recipe Book Sight">
    <meta name="twitter:description" content="A Recipe Book Sight for delicious recipes.">
    <meta name="twitter:image" content="images/social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" size="180x180" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="recipes.css"> 
    <script src="recipes.js" defer></script>
                    
</head>
<body>
    <header>
        <img src="images/recipe-book-icon.png" alt="Recipe icon">
        <h1>RecipeBook</h1>
    </header>
    <main>
    <form class="search-bar">
        <input id="search" type="text" placeholder="Find a recipe" aria-label="Search for a recipe">
        <button type="submit"> 
            <img src="images/search-icon.png" alt="Search icon"></button>
    </form>
            <div class="recipe-card" id="recipe-card">

            </div>
    </main>
    <footer>
        
        <a class="footer-link" href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>                         
        <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="images/instagram_icon.png" alt="instagram icon"></a>
        <a href="#"><img src="images/youtube_icon.png" alt="youtube icon"></a>
        <a href="#"><img src="images/pinterest_icon.png" alt="pinterest icon"></a>
        </div>                  
                
    </footer>
</body>
</html>
